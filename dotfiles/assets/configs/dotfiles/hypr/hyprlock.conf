general {
    disable_loading_bar = true
    grace = 0
    hide_cursor = true
}

background {
    monitor =
    path = ~/.config/hypr/images/image.jpg

    blur_passes = 4
    blur_size = 4
    noise = 0.0117
    contrast = 0.9
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A")"
    color = rgba(255, 255, 255, 0.9)
    font_size = 52
    font_family = Aquire

    shadow_passes = 2
    shadow_size = 4
    shadow_boost = 1.2

    position = 0, 190
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 0.9)
    font_size = 48
    font_family = Aquire

    shadow_passes = 2
    shadow_size = 4
    shadow_boost = 1.2

    position = 50, 50
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%d/%m/%Y")"
    color = rgba(255, 255, 255, 0.9)
    font_size = 48
    font_family = Aquire

    shadow_passes = 2
    shadow_size = 4
    shadow_boost = 1.2

    position = -50, 50
    halign = right
    valign = bottom
}

image {
    monitor =
    path = ~/.config/hypr/profile/image.jpg
    size = 110
    rounding = -1
    border_size = 3
    border_color = rgba(255, 255, 255, 0.3)

    position = 0, 60
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 0.9)
    font_size = 20
    font_family = Aquire

    shadow_passes = 2
    shadow_size = 4
    shadow_boost = 1.2

    position = 0, -15
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.25
    dots_center = true

    outer_color = rgba(255, 255, 255, 0.25)
    inner_color = rgba(30, 30, 30, 0.45)
    font_color = rgba(255, 255, 255, 0.95)
    fade_on_empty = false
    font_family = Aquire
    check_color = rgba(255, 255, 255, 0.4)
    fail_color = rgba(239, 68, 68, 0.6)

    placeholder_text = Enter Password

    rounding = 24

    position = 0, -80
    halign = center
    valign = center
}
